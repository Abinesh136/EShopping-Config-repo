server.port=8090
spring.application.name=delivery-service

spring.datasource.url=jdbc:h2:file:./data/deliverydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
management.endpoints.web.exposure.include=health,info

delivery.target.default-monthly=30
delivery.salary.base-monthly=15000.00
delivery.reward.full-target=2000.00
delivery.reward.partial-target=1000.00
delivery.incentive.per-delivery=50.00
